<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cart Tally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFAF7; --card:#FFFFFF; --ink:#1D2340; --muted:#6B7088; --line:#E4E2DA;
  --tag:#F5C84C; --tag-ink:#3A2C00; --go:#1E7A55; --warn:#B4452F; --soft:#F1EFE8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#15182A; --card:#1E2238; --ink:#F2F1EC; --muted:#A3A7BD; --line:#2F3450;
    --tag:#F5C84C; --tag-ink:#2B2100; --go:#5DD39E; --warn:#F08A72; --soft:#262B45;
  }
}
:root[data-theme="dark"]{
  --paper:#15182A; --card:#1E2238; --ink:#F2F1EC; --muted:#A3A7BD; --line:#2F3450;
  --tag:#F5C84C; --tag-ink:#2B2100; --go:#5DD39E; --warn:#F08A72; --soft:#262B45;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 150px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);
  padding:14px 0 12px;border-bottom:1px solid var(--line)}
.totalrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.total{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-weight:800;
  font-size:clamp(52px,17vw,76px);line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.total small{font-size:.45em;vertical-align:.7em;margin-right:2px;font-weight:600}
.meta{text-align:right;color:var(--muted);font-size:14px;padding-bottom:6px}
.meta b{color:var(--ink);font-size:18px;display:block}
.budgetline{margin-top:8px;font-size:14px;color:var(--muted);min-height:1.2em}
.budgetline.over{color:var(--warn);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden;display:none}
.bar i{display:block;height:100%;background:var(--go);width:0;transition:width .3s}
.bar.over i{background:var(--warn)}

.settings{display:flex;gap:10px;margin:14px 0 4px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;color:var(--ink)}
.pill input[type=checkbox]{width:18px;height:18px;accent-color:var(--go);margin:0}
.pill input[type=number]{width:70px;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;outline:none}
.dbadge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;
  background:var(--ink);color:var(--paper);font-weight:800;font-size:12px}

.status{margin:10px 0 0;font-size:14px;color:var(--muted)}
ul{list-style:none;margin:10px 0 0;padding:0}
li{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:10px;margin-bottom:8px;cursor:pointer}
li:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--soft);flex:none;
  display:grid;place-items:center;color:var(--muted);font-size:22px}
.info{flex:1;min-width:0}
.desc{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.flag{color:var(--warn);font-weight:600}
.descimg{display:block;max-height:40px;max-width:100%;border-radius:6px;background:#fff;padding:2px}
.sheet img.strip{max-height:none}
.price{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:22px;
  font-variant-numeric:tabular-nums;text-align:right;flex:none}
.price s{display:block;font-size:13px;font-weight:600;color:var(--muted)}
li.reading .descimg{display:block;max-height:40px;max-width:100%;border-radius:6px;background:#fff;padding:2px}
.sheet img.strip{max-height:none}
.price{color:var(--muted);font-size:15px;font-family:Figtree,sans-serif;font-weight:500}
li.reading .thumb{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){li.reading .thumb{animation:none}}
.empty{text-align:center;color:var(--muted);padding:44px 12px}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.send{display:block;width:100%;margin:18px 0 0;height:52px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-weight:600;font-size:16px}
.xhelp{margin:0 0 14px;color:var(--muted);font-size:14px}
.qrbox{background:#fff;border-radius:14px;padding:14px;display:grid;place-items:center}
.qrbox svg,.qrbox img{width:100%;height:auto;max-width:340px;display:block}
.xpage{text-align:center;margin-top:10px;font-weight:600;min-height:1.2em}
.clear{display:block;margin:18px auto 0;background:none;border:0;color:var(--muted);
  font:inherit;font-size:14px;text-decoration:underline;padding:10px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(to top,var(--paper) 70%,transparent);
  padding:18px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
button{font:inherit;cursor:pointer}
.scan{flex:1;height:64px;border-radius:18px;border:0;background:var(--tag);color:var(--tag-ink);
  font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 6px 18px rgba(0,0,0,.18)}
.scan:active{transform:translateY(1px)}
.scan{cursor:pointer;user-select:none;-webkit-user-select:none}
.type{width:100px;display:grid;place-items:center;cursor:pointer;height:64px;border-radius:18px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-weight:600;font-size:15px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

dialog{border:0;border-radius:20px;padding:0;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,25,.55)}
.sheet{padding:20px}
.sheet h2{margin:0 0 14px;font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:22px}
.sheet img{width:100%;max-height:200px;object-fit:contain;border-radius:12px;background:var(--soft);margin-bottom:12px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.sheet input[type=text],.sheet input[type=number]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font:inherit;font-size:18px}
.sheet .big{font-size:28px;font-weight:700}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--go)}
.acts{display:flex;gap:10px;margin-top:20px}
.acts button{flex:1;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:600}
.acts .primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.acts .danger{color:var(--warn);flex:0 0 auto;padding:0 16px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;
  max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;left:-9999px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="totalrow">
      <div class="total" id="total" aria-live="polite"><small>$</small>0.00</div>
      <div class="meta"><b id="count">0</b>items</div>
    </div>
    <div class="bar" id="bar"><i></i></div>
    <div class="budgetline" id="budgetline"></div>
  </header>

  <div class="settings">
    <label class="pill"><input type="checkbox" id="half"> <span class="dbadge">D</span> items half off</label>
    <label class="pill">Budget $<input type="number" id="budget" inputmode="decimal" min="0" step="1" placeholder="none"></label>
  </div>
  <p class="status" id="status"></p>

  <ul id="list"></ul>
  <div class="empty" id="empty"><strong>Cart's empty</strong>Scan the square code on a tag and the price lands here. Tap any item to fix or remove it.</div>
  <button class="send" id="send" hidden>⇄ Send my items to the other phone</button>
  <button class="clear" id="clear" hidden>Clear cart</button>
</div>

<div class="dock"><div class="in">
  <label class="scan" id="snap" for="cam" role="button" tabindex="0">📷 Snap tag</label>
  <button class="type" id="typeBtn">Type price</button>
</div></div>
<input type="file" id="cam" accept="image/*" capture="environment">

<dialog id="dlg"><form method="dialog" class="sheet" id="form">
  <h2 id="dlgTitle">Item</h2>
  <img id="dlgImg" alt="Tag photo" hidden>
  <label class="f" for="fPrice">Tag price</label>
  <input type="number" id="fPrice" class="big" inputmode="decimal" step="0.01" min="0" required>
  <label class="f" for="fDesc">Description</label>
  <input type="text" id="fDesc" placeholder="Optional">
  <label class="chk"><input type="checkbox" id="fDisc"> Has the <span class="dbadge">D</span> (discount) mark</label>
  <div class="acts">
    <button type="button" class="danger" id="fDel">Remove</button>
    <button type="button" id="fCancel">Cancel</button>
    <button type="submit" class="primary" id="fSave">Save</button>
  </div>
</form></dialog>
<dialog id="xfer"><div class="sheet">
  <h2>Send to the other phone</h2>
  <p class="xhelp">On the other phone, tap <b>Snap tag</b> and take a photo of this code. Turn your screen brightness up if it won't read.</p>
  <div class="qrbox" id="qrbox"></div>
  <div class="xpage" id="xpage"></div>
  <div class="acts" id="xnav"><button type="button" id="xprev">Previous code</button><button type="button" id="xnext" class="primary">Next code</button></div>
  <div class="acts"><button type="button" id="xclose">Cancel</button><button type="button" class="primary" id="xdone">They got it — empty my cart</button></div>
</div></dialog>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(() => {
  const KEY = "cart-tally-v1";
  const $ = id => document.getElementById(id);
  let state = { items: [], half: false, budget: null, got: [] };
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && Array.isArray(s.items)) state = Object.assign(state, s); } catch (e) {}
  state.items.forEach(it => { if (it.status === "reading") it.status = "error"; });

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
  const money = n => (Math.round(n * 100) / 100).toFixed(2);
  const eff = it => (it.price == null ? 0 : (state.half && it.disc ? it.price / 2 : it.price));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const totalNow = () => state.items.reduce((s, i) => s + eff(i), 0);

  let toastT;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }
  function buzz() { try { navigator.vibrate && navigator.vibrate(60); } catch (e) {} }

  // Tag QR format: CONSIGNOR-PRICE-DISCOUNTFLAG-ITEMNUMBER  e.g. D596CAB-1.75-1-192859901
  function parseTag(txt) {
    const m = String(txt || "").trim().match(/^([A-Za-z0-9]+)-(\d+(?:\.\d+)?)-([01])-(\d{5,})$/);
    if (!m) return null;
    return { consignor: m[1], price: Math.round(parseFloat(m[2]) * 100) / 100, disc: m[3] === "1", itemNo: m[4] };
  }
  // returns "added" | "dup" | null
  function addTag(tag) {
    if (state.items.some(i => i.itemNo === tag.itemNo)) return "dup";
    const it = { id: uid(), price: tag.price, disc: tag.disc, itemNo: tag.itemNo, consignor: tag.consignor, desc: "", descImg: tag.descImg || null, status: "ok" };
    state.items.push(it);
    save(); render();
    if (tag.descCanvas) readText(it, tag.descCanvas);
    return "added";
  }

  // ---------- turn the description strip into text (on the phone, no AI) ----------
  // Uses Tesseract, a classic open-source text reader. It's loaded in the background at
  // startup so it's cached before the event; if it can't load, the photo strip is used instead.
  let ocrWorker = null, ocrLoading = null;
  function loadOCR() {
    if (ocrLoading) return ocrLoading;
    ocrLoading = new Promise((res, rej) => {
      if (window.Tesseract) return res();
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
      s.onload = res; s.onerror = rej; document.head.append(s);
    }).then(async () => {
      const w = await Tesseract.createWorker("eng");
      try { await w.setParameters({ tessedit_pageseg_mode: "6" }); } catch (e) {}
      ocrWorker = w; return w;
    }).catch(() => { ocrLoading = null; return null; });
    return ocrLoading;
  }
  let ocrQueue = Promise.resolve();
  function readText(it, canvas) {
    ocrQueue = ocrQueue.then(async () => {
      const w = ocrWorker || await loadOCR();
      if (!w) return;
      try {
        const { data } = await w.recognize(canvas);
        const txt = String(data.text || "").replace(/\s+/g, " ").trim();
        if (txt && (data.confidence ?? 100) >= 45 && !it.desc && state.items.includes(it)) { it.desc = txt; it.descAuto = true; save(); render(); }
      } catch (e) {}
    });
  }
  function halfImg(cv) {
    const o = document.createElement("canvas"); o.width = Math.max(1, Math.round(cv.width / 2)); o.height = Math.max(1, Math.round(cv.height / 2));
    o.getContext("2d").drawImage(cv, 0, 0, o.width, o.height); return o.toDataURL("image/jpeg", 0.7);
  }

  function render() {
    const total = totalNow();
    $("total").innerHTML = "<small>$</small>" + money(total);
    $("count").textContent = state.items.length;
    $("half").checked = state.half;
    if (document.activeElement !== $("budget")) $("budget").value = state.budget ?? "";

    const bar = $("bar"), bl = $("budgetline");
    if (state.budget > 0) {
      const left = state.budget - total, pct = Math.min(100, total / state.budget * 100);
      bar.style.display = "block"; bar.querySelector("i").style.width = pct + "%";
      bar.classList.toggle("over", left < 0); bl.classList.toggle("over", left < 0);
      bl.textContent = left >= 0 ? "$" + money(left) + " left of $" + money(state.budget) : "$" + money(-left) + " over budget";
    } else {
      bar.style.display = "none"; bl.classList.remove("over");
      const saved = state.half ? state.items.filter(i => i.disc && i.price != null).reduce((s, i) => s + i.price / 2, 0) : 0;
      bl.textContent = saved > 0 ? "Saving $" + money(saved) + " on D items" : "";
    }

    const ul = $("list"); ul.textContent = "";
    [...state.items].reverse().forEach(it => {
      const li = document.createElement("li"); li.tabIndex = 0;
      const th = it.thumb ? Object.assign(document.createElement("img"), { src: it.thumb, alt: "" }) : Object.assign(document.createElement("div"), { textContent: "🏷️" });
      th.className = "thumb";
      const info = document.createElement("div"); info.className = "info";
      const d = document.createElement("div"); d.className = "desc";
      if (!it.desc && it.descImg) { const im = document.createElement("img"); im.src = it.descImg; im.alt = "Tag description"; im.className = "descimg"; d.append(im); }
      else d.textContent = it.desc || (it.itemNo ? "Item " + it.itemNo : (it.status === "error" ? "Needs a price" : "Item"));
      const sub = document.createElement("div"); sub.className = "sub";
      if (it.disc) { const b = document.createElement("span"); b.className = "dbadge"; b.textContent = "D"; sub.append(b); }
      if (it.itemNo) sub.append(document.createTextNode("#" + it.itemNo));
      if (it.from) sub.append(document.createTextNode("· from other phone"));
      if (it.status === "error") { const f = document.createElement("span"); f.className = "flag"; f.textContent = "Tap to enter price"; sub.append(f); }
      info.append(d, sub);
      const p = document.createElement("div"); p.className = "price";
      if (it.price == null) p.textContent = "—";
      else {
        p.textContent = "$" + money(eff(it));
        if (state.half && it.disc) { const s = document.createElement("s"); s.textContent = "$" + money(it.price); p.append(s); }
      }
      li.append(th, info, p);
      li.onclick = () => openEdit(it);
      li.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEdit(it); } };
      ul.append(li);
    });
    $("empty").hidden = state.items.length > 0;
    $("clear").hidden = state.items.length === 0;
    $("send").hidden = state.items.length === 0;
  }

  // ---------- edit sheet ----------
  let editing = null;
  function openEdit(it) {
    editing = it;
    $("dlgTitle").textContent = it.id ? "Edit item" : "Add item";
    $("fPrice").value = it.price ?? ""; $("fDesc").value = it.desc || ""; $("fDisc").checked = !!it.disc;
    const pic = it.descImg || it.thumbLarge || it.thumb; $("dlgImg").hidden = !pic; if (pic) $("dlgImg").src = pic;
    $("fDel").hidden = !it.id;
    $("dlg").showModal();
    setTimeout(() => { if (it.price == null) $("fPrice").focus(); }, 50);
  }
  $("form").addEventListener("submit", e => {
    const v = parseFloat($("fPrice").value);
    if (!(v >= 0)) { e.preventDefault(); $("fPrice").focus(); return; }
    const it = editing;
    it.price = Math.round(v * 100) / 100; it.desc = $("fDesc").value.trim(); it.disc = $("fDisc").checked; it.status = "ok";
    if (!it.id) { it.id = uid(); state.items.push(it); }
    save(); render();
  });
  $("fCancel").onclick = () => $("dlg").close();
  $("fDel").onclick = () => { state.items = state.items.filter(i => i !== editing); save(); render(); $("dlg").close(); toast("Removed"); };
  $("typeBtn").onclick = () => openEdit({ price: null, desc: "", disc: false, status: "manual" });

  $("half").onchange = e => { state.half = e.target.checked; save(); render(); };
  $("budget").oninput = e => { const v = parseFloat(e.target.value); state.budget = v > 0 ? v : null; save(); render(); };
  let clearArmed = 0;
  $("clear").onclick = () => {
    if (Date.now() - clearArmed < 3000) { clearArmed = 0; $("clear").textContent = "Clear cart"; state.items = []; save(); render(); toast("Cart cleared"); return; }
    clearArmed = Date.now(); $("clear").textContent = "Tap again to clear everything";
    setTimeout(() => { $("clear").textContent = "Clear cart"; }, 3000);
  };

  // ---------- QR decoding ----------
  const detector = ("BarcodeDetector" in window) ? (() => { try { return new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { return null; } })() : null;
  const work = document.createElement("canvas"), wctx = work.getContext("2d", { willReadFrequently: true });
  async function decodeAll(src, w, h) {
    // returns array of raw strings
    if (detector) {
      // Detect on a canvas copy, not the photo itself: some browsers report the photo's
      // corner points in the camera's raw (sideways) orientation, which misplaces the crop.
      try {
        const s = Math.min(1, 2000 / Math.max(w, h)), k = 1 / s;
        work.width = Math.round(w * s); work.height = Math.round(h * s);
        wctx.drawImage(src, 0, 0, work.width, work.height);
        const r = await detector.detect(work);
        if (r.length) return r.map(x => ({ raw: x.rawValue, corners: x.cornerPoints && x.cornerPoints.length === 4 ? x.cornerPoints.map(q => ({ x: q.x * k, y: q.y * k })) : null }));
      } catch (e) {}
    }
    if (!window.jsQR) return [];
    const out = [];
    const tries = [1100, 700, 1600];
    for (const max of tries) {
      const s = Math.min(1, max / Math.max(w, h));
      work.width = Math.round(w * s); work.height = Math.round(h * s);
      wctx.drawImage(src, 0, 0, work.width, work.height);
      const img = wctx.getImageData(0, 0, work.width, work.height);
      const r = jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
      if (r && r.data) {
        const L = r.location, k = 1 / s, P = q => ({ x: q.x * k, y: q.y * k });
        out.push({ raw: r.data, corners: L ? [P(L.topLeftCorner), P(L.topRightCorner), P(L.bottomRightCorner), P(L.bottomLeftCorner)] : null });
        break;
      }
    }
    return out;
  }

  // ---------- still photo ----------
  function loadImg(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("decode")); };
      img.src = url;
    });
  }
  // The description line sits just above the QR code on every tag. Using the QR's corners as a
  // ruler (1 unit = one QR side), crop that strip straight out of the photo, even if it's tilted.
  function cropDesc(img, c) {
    try {
      const [tl, tr, , bl] = c;
      const ux = { x: tr.x - tl.x, y: tr.y - tl.y }, vy = { x: bl.x - tl.x, y: bl.y - tl.y };
      // Look at a tall region above the QR, then find the text line(s) closest to the code.
      const U0 = -1.9, U1 = 2.9, V0 = -2.2, V1 = -0.02, K = 220;
      const W = Math.round((U1 - U0) * K), H = Math.round((V1 - V0) * K);
      const det = ux.x * vy.y - vy.x * ux.y; if (!det) return null;
      const a = K * vy.y / det, c2 = -K * vy.x / det, b = -K * ux.y / det, d = K * ux.x / det;
      const P0 = { x: tl.x + U0 * ux.x + V0 * vy.x, y: tl.y + U0 * ux.y + V0 * vy.y };
      const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
      const g = cv.getContext("2d", { willReadFrequently: true });
      g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
      g.setTransform(a, b, c2, d, -(a * P0.x + c2 * P0.y), -(b * P0.x + d * P0.y));
      g.drawImage(img, 0, 0);
      g.setTransform(1, 0, 0, 1, 0, 0);
      const px = g.getImageData(0, 0, W, H).data, ink = new Uint8Array(W * H); let sum = 0;
      const lum = new Float32Array(W * H);
      for (let i = 0; i < W * H; i++) { const l = 0.3 * px[i * 4] + 0.59 * px[i * 4 + 1] + 0.11 * px[i * 4 + 2]; lum[i] = l; sum += l; }
      const thr = (sum / (W * H)) * 0.62;
      for (let i = 0; i < W * H; i++) ink[i] = lum[i] < thr ? 1 : 0;
      // text rows, measured in the middle of the tag (away from edges/borders)
      const c0 = Math.round((-1.2 - U0) * K), c1 = Math.round((2.2 - U0) * K);
      const runs = []; let st = -1, last = -99;
      for (let y = 0; y < H; y++) {
        let n = 0; for (let x = c0; x < c1; x++) n += ink[y * W + x];
        if (n >= 2) { if (st < 0) st = y; else if (y - last > 3) { runs.push([st, last]); st = y; } last = y; }
      }
      if (st >= 0) runs.push([st, last]);
      const lines = runs.filter(r => r[1] - r[0] >= 4 && r[1] < H - 4); // skip specks and anything touching the QR
      if (!lines.length) return null;
      let [top, bot] = lines[lines.length - 1]; const h0 = bot - top + 1;
      if (lines.length > 1) { const [pt, pb] = lines[lines.length - 2]; if (top - pb <= h0 && (pb - pt + 1) <= 2 * h0) top = pt; } // 2-line descriptions
      top = Math.max(0, top - 6); bot = Math.min(H - 1, bot + 6);
      // columns: keep the main cluster of words, drop stray edges/borders
      const colInk = new Uint32Array(W);
      for (let y = top; y <= bot; y++) for (let x = 0; x < W; x++) colInk[x] += ink[y * W + x];
      const clusters = []; let cs = -1, cp = -1, cw = 0;
      for (let x = 0; x < W; x++) if (colInk[x]) {
        if (cs < 0) { cs = x; cw = 0; } else if (x - cp > 0.2 * K) { clusters.push([cs, cp, cw]); cs = x; cw = 0; }
        cp = x; cw += colInk[x];
      }
      if (cs < 0) return null; clusters.push([cs, cp, cw]);
      const best = clusters.reduce((m, k) => (k[2] > m[2] ? k : m));
      const x0 = Math.max(0, best[0] - 6), x1 = Math.min(W - 1, best[1] + 6);
      const out = document.createElement("canvas"); out.width = x1 - x0 + 1; out.height = bot - top + 1;
      const og = out.getContext("2d"); og.fillStyle = "#fff"; og.fillRect(0, 0, out.width, out.height);
      og.drawImage(cv, x0, top, out.width, out.height, 0, 0, out.width, out.height);
      return out;
    } catch (e) { return null; }
  }
  function thumbOf(img, max) {
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", 0.6);
  }
  $("snap").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("cam").click(); } };
  $("cam").onchange = async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = "";
    if (!file) return;
    let img;
    try { img = await loadImg(file); } catch (err) { toast("Couldn't open that photo"); return; }
    const vals = await decodeAll(img, img.naturalWidth, img.naturalHeight);
    const xfers = vals.filter(v => String(v.raw).startsWith("CTX1|"));
    if (xfers.length) { xfers.forEach(v => receive(v.raw)); return; }
    const tags = vals.map(v => { const t = parseTag(v.raw); if (t && v.corners) { const cv = cropDesc(img, v.corners); if (cv) { t.descCanvas = cv; t.descImg = halfImg(cv); } } return t; }).filter(Boolean);
    if (!tags.length) {
      toast("Couldn't find the code — type the price");
      openEdit({ price: null, desc: "", disc: false, status: "manual", thumb: thumbOf(img, 96), thumbLarge: thumbOf(img, 360) });
      return;
    }
    let added = 0, dup = 0;
    tags.forEach(t => { addTag(t) === "added" ? added++ : dup++; });
    buzz();
    toast(added ? (added === 1 ? "Added $" + money(eff(state.items[state.items.length - 1])) : added + " tags added") + (dup ? " · " + dup + " already in cart" : "") : "Already in cart");
  };

  // ---------- phone-to-phone transfer ----------
  // Payload: CTX1|batch|page|pages|item^item^...   item = itemNo~price~d~description
  const clean = s => String(s || "").replace(/[|^~]/g, " ").slice(0, 40);
  const BUDGET = 600; // characters per code, keeps each code easy to photograph
  let xfer = null;
  function openSend() {
    if (!window.qrcode) { toast("Code maker didn't load — check signal and reload"); return; }
    const items = [...state.items].filter(i => i.price != null);
    if (!items.length) { toast("Nothing to send yet"); return; }
    const batch = uid(), enc = i => [i.itemNo || "", money(i.price), i.disc ? 1 : 0, clean(i.desc)].join("~");
    const groups = []; let cur = [], len = 0;
    items.forEach(i => { const s = enc(i); if (cur.length && len + s.length + 1 > BUDGET) { groups.push(cur); cur = []; len = 0; } cur.push(s); len += s.length + 1; });
    if (cur.length) groups.push(cur);
    xfer = { batch, ids: items.map(i => i.id), pages: groups.map((g, n) => ["CTX1", batch, n + 1, groups.length, g.join("^")].join("|")), n: 0 };
    showPage(); $("xdone").textContent = "They got it — empty my cart"; xArmed = 0;
    $("xfer").showModal();
  }
  function showPage() {
    const qr = qrcode(0, "M"); qr.addData(xfer.pages[xfer.n]); qr.make();
    $("qrbox").innerHTML = qr.createSvgTag({ cellSize: 6, margin: 4, scalable: true });
    const N = xfer.pages.length;
    $("xpage").textContent = N > 1 ? "Code " + (xfer.n + 1) + " of " + N + " — photograph each one" : xfer.ids.length + " items";
    $("xnav").hidden = N < 2; $("xprev").disabled = xfer.n === 0; $("xnext").disabled = xfer.n === N - 1;
  }
  $("send").onclick = openSend;
  $("xprev").onclick = () => { if (xfer.n > 0) { xfer.n--; showPage(); } };
  $("xnext").onclick = () => { if (xfer.n < xfer.pages.length - 1) { xfer.n++; showPage(); } };
  $("xclose").onclick = () => $("xfer").close();
  let xArmed = 0;
  $("xdone").onclick = () => {
    if (Date.now() - xArmed > 4000) { xArmed = Date.now(); $("xdone").textContent = "Tap again to empty"; return; }
    const sent = new Set(xfer.ids);
    const n = state.items.filter(i => sent.has(i.id)).length;
    state.items = state.items.filter(i => !sent.has(i.id));
    save(); render(); $("xfer").close(); toast(n + " items handed off");
  };
  function receive(raw) {
    const parts = String(raw).split("|");
    if (parts.length < 5) { toast("Couldn't read that code — try again"); return; }
    const [, batch, page, pages] = parts, body = parts.slice(4).join("|");
    const key = batch + ":" + page;
    if ((state.got || []).includes(key)) { toast("Already got that code"); return; }
    let added = 0, dup = 0;
    body.split("^").filter(Boolean).forEach(s => {
      const [itemNo, price, d, desc] = s.split("~");
      const pr = parseFloat(price); if (!(pr >= 0)) return;
      if (itemNo && state.items.some(i => i.itemNo === itemNo)) { dup++; return; }
      state.items.push({ id: uid(), price: Math.round(pr * 100) / 100, disc: d === "1", itemNo: itemNo || null, desc: desc || "", status: "ok", from: true });
      added++;
    });
    state.got = [...(state.got || []), key].slice(-200);
    save(); render(); buzz();
    const more = +pages > 1 ? " (code " + page + " of " + pages + ")" : "";
    toast("Got " + added + " item" + (added === 1 ? "" : "s") + " from the other phone" + more + (dup ? " · " + dup + " already here" : ""));
  }

  setTimeout(() => { loadOCR(); }, 1500);

  if (!window.jsQR && !detector) $("status").textContent = "Scanner didn't load — check signal and reload. Type still works.";
  render();
})();
</script>
</body>
